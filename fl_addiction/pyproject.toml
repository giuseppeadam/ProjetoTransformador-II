[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fl-addiction"
version = "0.1.0"
description = "Federated Learning (Flower) sobre o dataset de vicio digital - ProjetoTransformador-II"
dependencies = [
    "flwr[simulation]>=1.28.0",
    "torch>=2.5.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["fl_addiction"]

[tool.flwr.app]
publisher = "adm"

[tool.flwr.app.components]
serverapp = "fl_addiction.app:server_app"
clientapp = "fl_addiction.app:client_app"

[tool.flwr.app.config]
strategy = "fedavg"
num-server-rounds = 10
fraction-evaluate = 1.0
local-epochs = 3
learning-rate = 0.01
batch-size = 32
save-model = true

proximal-mu = 0.01
eta = 0.01
eta-l = 0.1
beta-1 = 0.9
beta-2 = 0.99
tau = 1e-9
